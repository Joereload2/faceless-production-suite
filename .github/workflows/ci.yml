name: ci
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager". Setting `version:` here too
      # makes action-setup@v4 fail ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @faceless/schema build:contract
      - run: git diff --exit-code -- packages/schema/contract.json
      - run: pnpm -r typecheck
      - run: pnpm -r test
